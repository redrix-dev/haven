# Dependabot version updates.
#
# Why this exists: with only default security *alerts* on (no config), findings
# pile up unbatched — 70+ open at once — and never become actionable PRs. This
# turns on *version updates* so fixes arrive as small, reviewable PRs on a
# cadence instead.
#
# Conventions that match the repo:
#   - PRs target `staging`, the integration branch (never `main`). See AGENTS.md.
#   - minor+patch are grouped per ecosystem into one PR so routine bumps don't
#     fan out; majors stay ungrouped (one PR each) because they need a human
#     decision — especially the mobile Expo SDK and the Tauri/webkit stack.
version: 2
updates:
  # ── Root workspace: desktop/web Solid client + shared + build/test tooling ──
  # Everything here is devDependency / build tooling; nothing ships to users.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      root-minor-and-patch:
        update-types: ["minor", "patch"]

  # ── Mobile app (Expo / React Native) — a live release surface ──
  # Group the small stuff; let majors (Expo SDK, metro, etc.) land one at a
  # time so an SDK bump can be verified with mobile:release:check on its own.
  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    groups:
      mobile-minor-and-patch:
        update-types: ["minor", "patch"]

  # ── Mobile Ruby tooling (Fastlane / CocoaPods) ──
  - package-ecosystem: "bundler"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      mobile-gems-minor-and-patch:
        update-types: ["minor", "patch"]

  # ── Tauri desktop shell (Rust) ──
  # Keep Windows/Linux/macOS lockfile churn reviewable — one grouped PR, and
  # mind the documented cross-platform Cargo.lock footgun before merging.
  - package-ecosystem: "cargo"
    directory: "/apps/tauri/src-tauri"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      tauri-shell-minor-and-patch:
        update-types: ["minor", "patch"]

  # NOTE: the native voice sidecar (/apps/tauri/haven-voice) is intentionally
  # NOT tracked here. It is quarantined (desktop no longer ships to Linux) —
  # nothing builds it, so its livekit/libwebrtc deps must not generate update
  # PRs or alerts. Re-add a cargo entry here to resurrect it. See
  # apps/tauri/haven-voice/QUARANTINE.md.

  # ── GitHub Actions workflows ──
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "staging"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    groups:
      github-actions-all:
        patterns: ["*"]
